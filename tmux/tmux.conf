# ============================================================
#  Prefix
# ============================================================
set -g prefix C-a #change prefix


# ============================================================
#  General
# ============================================================
set-option -g history-limit 5000 #increase word history stored
set -g display-time 4000 #more time for message display
setw -g aggressive-resize on #avoid 0s filling up screen
setw -g mode-keys vi


# ============================================================
#  Numbering
# ============================================================
set -g base-index 1 #starts counting panes at 1
setw -g pane-base-index 1
set -g renumber-windows on #if a window is deleted, the others will renumber themselves to avoid a gap.


# ============================================================
#  Panes: splitting
# ============================================================
bind-key "|" split-window -h -c "#{pane_current_path}" #change window split
bind-key "\\" split-window -fh -c "#{pane_current_path}"

bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "_" split-window -fv -c "#{pane_current_path}"


# ============================================================
#  Panes: resizing
# ============================================================
bind -r C-j resize-pane -D 10 #vim-like resize bind and biggerincrements.
bind -r C-k resize-pane -U 10
bind -r C-h resize-pane -L 10
bind -r C-l resize-pane -R 10


# ============================================================
#  Windows
# ============================================================
bind c new-window -c "#{pane_current_path}" #new window at og dir

bind -r "<" swap-window -d -t -1 #more recognisable window order swap bind
bind -r ">" swap-window -d -t +1


# ============================================================
#  Shortcuts
# ============================================================
bind-key h split-window -h "vim ~/scratch/notes.md" #shortcut for opening noted markdown quickly


# ============================================================
#  Plugins (TPM) - keep at the bottom
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-open'

run '~/.tmux/plugins/tpm/tpm'
